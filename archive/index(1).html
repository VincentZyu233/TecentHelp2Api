<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元宝 OpenAI 代理 - 测试</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 16px; }
  .topbar .tag { background: #07c160; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
  .topbar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; }
  .topbar input { background: #2a2a4a; border: 1px solid #444; color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 13px; width: 180px; }
  .topbar select { background: #2a2a4a; border: 1px solid #444; color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .main { flex: 1; display: flex; overflow: hidden; }
  .chat { flex: 1; display: flex; flex-direction: column; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .av { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex-shrink: 0; }
  .msg.ai .av { background: linear-gradient(135deg, #667eea, #764ba2); }
  .msg.user .av { background: #07c160; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; word-break: break-word; }
  .msg.ai .bubble { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); border-top-left-radius: 4px; }
  .msg.user .bubble { background: #07c160; color: #fff; border-top-right-radius: 4px; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 6px 0 3px; } .bubble h2 { font-size: 15px; }
  .bubble ul,.bubble ol { padding-left: 18px; margin: 3px 0; } .bubble li { margin: 2px 0; }
  .bubble p { margin: 3px 0; } .bubble code { background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
  .bubble pre { background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble blockquote { border-left: 3px solid #07c160; padding-left: 10px; color: #666; margin: 4px 0; }
  .bubble a { color: #409eff; }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #999; margin: 0 2px; animation: b 1.4s infinite; }
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes b {0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
  .input-bar { padding: 14px 20px; background: #fff; border-top: 1px solid #e4e7ed; display: flex; gap: 10px; }
  .input-bar textarea { flex: 1; border: 1px solid #dcdfe6; border-radius: 10px; padding: 8px 14px; font-size: 14px; resize: none; outline: none; max-height: 100px; min-height: 42px; line-height: 1.5; font-family: inherit; }
  .input-bar textarea:focus { border-color: #07c160; }
  .btn { border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn-send { background: #07c160; color: #fff; } .btn-send:hover { background: #06ad56; }
  .btn-send:disabled { background: #c0c4cc; cursor: not-allowed; }
  .btn-stop { background: #f56c6c; color: #fff; }
  .dev { width: 380px; background: #1e1e1e; color: #d4d4d4; overflow-y: auto; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; }
  .dev-entry { border-bottom: 1px solid #333; padding: 8px 12px; }
  .dev-method { font-weight: 700; padding: 1px 5px; border-radius: 3px; font-size: 10px; }
  .dev-method.POST { background: #6b4f1a; color: #f0c674; }
  .dev-method.SSE { background: #4a1a6b; color: #d2a8ff; }
  .dev-url { color: #79c0ff; word-break: break-all; }
  .dev-body { background: #2d2d2d; border-radius: 4px; padding: 5px 7px; margin-top: 4px; white-space: pre-wrap; word-break: break-all; color: #c9d1d9; max-height: 180px; overflow-y: auto; }
  .dev-label { color: #8b949e; font-size: 10px; margin-top: 4px; }
  ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
  .dev::-webkit-scrollbar-thumb { background: #555; }
  .info-bar { background: #e8f5e9; border-bottom: 1px solid #c8e6c9; padding: 6px 24px; font-size: 12px; color: #2e7d32; display: flex; gap: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>元宝 OpenAI 代理 <span class="tag">兼容模式</span></h1>
  <div class="right">
    <label>API Key:</label>
    <input id="apiKey" placeholder="留空=不鉴权" value="">
    <label>Model:</label>
    <select id="model"><option value="yuanbao">yuanbao</option><option value="hunyuan">hunyuan</option></select>
  </div>
</div>
<div class="info-bar">
  <span>POST /v1/chat/completions</span>
  <span id="statusDot" style="color:#999">● 检查中...</span>
</div>
<div class="main">
  <div class="chat">
    <div class="msgs" id="msgs">
      <div class="msg ai"><div class="av">AI</div><div class="bubble">你好！这是通过 <strong>OpenAI 兼容接口</strong> 调用腾讯元宝的测试页面。输入问题后，会用标准 <code>/v1/chat/completions</code> 格式请求，流式返回回答。</div></div>
    </div>
    <div class="input-bar">
      <textarea id="input" rows="1" placeholder="输入问题（Enter 发送）"></textarea>
      <button class="btn btn-send" id="sendBtn">发送</button>
      <button class="btn btn-stop" id="stopBtn" style="display:none">停止</button>
    </div>
  </div>
  <div class="dev" id="devPanel"></div>
</div>
<script>
const API = '/v1/chat/completions';
let abortCtrl = null, streaming = false;

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function devLog(method, url, opts={}) {
  const panel = document.getElementById('devPanel');
  const entry = document.createElement('div');
  entry.className = 'dev-entry';
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  let bodyHtml = '';
  if (opts.body) bodyHtml += `<div class="dev-label">请求体:</div><div class="dev-body">${escapeHtml(JSON.stringify(opts.body,null,2))}</div>`;
  entry.innerHTML = `<div><span class="dev-method ${method}">${method}</span> <span class="dev-url">${escapeHtml(url)}</span> <span style="color:#8b949e;font-size:10px">${t}</span></div>${bodyHtml}<div class="dev-label" style="margin-top:4px">响应:</div><div class="dev-body">等待中...</div>`;
  panel.appendChild(entry);
  panel.scrollTop = panel.scrollHeight;
  return entry;
}
function devResp(entry, text) {
  const el = entry.querySelector('.dev-body:last-child');
  if (el) { el.textContent = typeof text==='string'?text:JSON.stringify(text,null,2); if(el.textContent.length>2000) el.textContent=el.textContent.slice(0,2000)+'\n...'; }
  entry.scrollIntoView({block:'end'});
}

function addMsg(role, text) {
  const c = document.getElementById('msgs');
  const m = document.createElement('div');
  m.className = 'msg '+role;
  m.innerHTML = `<div class="av">${role==='user'?'我':'AI'}</div><div class="bubble"></div>`;
  const b = m.querySelector('.bubble');
  b.innerHTML = role==='user' ? escapeHtml(text) : (marked ? marked.parse(text,{breaks:true}) : escapeHtml(text).replace(/\n/g,'<br>'));
  c.appendChild(m); c.scrollTop = c.scrollHeight;
  return b;
}

async function send() {
  const q = document.getElementById('input').value.trim();
  if (!q || streaming) return;
  streaming = true;
  document.getElementById('sendBtn').style.display='none';
  document.getElementById('stopBtn').style.display='inline-block';

  addMsg('user', q);
  document.getElementById('input').value = '';
  document.getElementById('input').style.height = 'auto';

  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value;

  const reqBody = {
    model,
    messages: [{ role: 'user', content: q }],
    stream: true,
  };

  const entry = devLog('POST', API, { body: reqBody });
  abortCtrl = new AbortController();

  // 思考中占位
  const c = document.getElementById('msgs');
  const tm = document.createElement('div');
  tm.className = 'msg ai';
  tm.innerHTML = `<div class="av">AI</div><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>`;
  c.appendChild(tm);
  let bubble = tm.querySelector('.bubble');
  let accum = '';
  let firstChunk = true;

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'Authorization': 'Bearer '+apiKey } : {}) },
      body: JSON.stringify(reqBody),
      signal: abortCtrl.signal,
    });

    devResp(entry, `HTTP ${resp.status} ${resp.statusText}`);

    if (!resp.ok) {
      tm.remove();
      const errText = await resp.text();
      devResp(entry, errText);
      addMsg('ai', '⚠️ 错误: ' + errText);
      streaming = false;
      document.getElementById('sendBtn').style.display='inline-block';
      document.getElementById('stopBtn').style.display='none';
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const jsonStr = t.slice(5).trim();
        if (jsonStr === '[DONE]') continue;
        let chunk;
        try { chunk = JSON.parse(jsonStr); } catch { continue; }
        const delta = chunk.choices?.[0]?.delta || {};
        if (delta.content) {
          if (firstChunk) { tm.querySelector('.dots')?.remove(); firstChunk = false; }
          accum += delta.content;
          bubble.innerHTML = marked ? marked.parse(accum, {breaks:true}) : escapeHtml(accum).replace(/\n/g,'<br>');
          c.scrollTop = c.scrollHeight;
        }
        if (chunk.choices?.[0]?.finish_reason === 'stop') {
          devResp(entry, `✅ 流式完成 | 共 ${accum.length} 字`);
        }
      }
    }
    if (firstChunk) tm.remove();
  } catch (err) {
    tm.remove();
    if (err.name === 'AbortError') {
      devResp(entry, '⏹ 已停止');
      if (bubble) bubble.innerHTML += '<p style="color:#999;font-size:12px">（已停止）</p>';
    } else {
      devResp(entry, '❌ ' + err.message);
      addMsg('ai', '⚠️ ' + err.message);
    }
  }
  streaming = false;
  document.getElementById('sendBtn').style.display='inline-block';
  document.getElementById('stopBtn').style.display='none';
}

// 健康检查
fetch('/health').then(r=>r.json()).then(d=>{
  document.getElementById('statusDot').textContent = '● 服务正常 ' + d.upstream;
  document.getElementById('statusDot').style.color = '#07c160';
}).catch(()=>{
  document.getElementById('statusDot').textContent = '● 服务异常';
  document.getElementById('statusDot').style.color = '#f56c6c';
});

document.getElementById('input').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,100)+'px'; });
document.getElementById('input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('stopBtn').addEventListener('click', ()=>abortCtrl?.abort());
document.getElementById('input').focus();
</script>
</body>
</html>
